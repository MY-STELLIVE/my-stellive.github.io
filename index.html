 const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
 const x=Object.fromEntries(parts.map(p=>[p.type,p.value]));
 return {date:`${x.year}-${x.month}-${x.day}`,minute:Number(x.hour)*60+Number(x.minute),clock:`${x.hour}:${x.minute}`};
}
// v2.4.2: manually confirmed broadcasting sessions. ISO timestamps carry +09:00.
function kstISO(){return new Date(Date.now()+9*3600000).toISOString().slice(0,19)+'+09:00'}
function kstLocalISO(date,time){return date+'T'+time+':00+09:00'}
function liveSessions(){return []}
function sessionFor(date,id){return liveSessions().find(x=>x.member===id&&x.startDate===date)||null}
function sessionAt(date,id){const today=kstNowParts().date;return liveSessions().filter(x=>x.member===id&&typeof x.startedAt==='string'&&x.startedAt.slice(0,10)<=date&&(x.endedAt?x.endedAt.slice(0,10)>=date:date<=today)).sort((a,b)=>b.startedAt.localeCompare(a.startedAt))[0]||null}
function sessionDuration(x){if(!x?.endedAt)return '';const minutes=Math.max(0,Math.round((Date.parse(x.endedAt)-Date.parse(x.startedAt))/60000));return Math.floor(minutes/60)+'시간 '+minutes%60+'분'}
function sessionTimeline(x){
 const items=Array.isArray(x.changes)?x.changes:[];
 if(!items.length)return '<p class="muted">방제·카테고리 변경 기록이 없습니다.</p>';
 return `<ol class="session-timeline">${items.slice().sort((a,b)=>String(a.at).localeCompare(String(b.at))).map(e=>`<li><time>${esc(e.at.slice(0,16).replace('T',' '))} KST</time><div><strong>${e.field==='title'?'🎙 방제':'🎮 카테고리'} ${e.type==='initial'?'최초 기록':'변경'}</strong><div class="session-change">${e.type==='initial'?'':`<span>${esc(e.before||'(없음)')}</span><b>→</b>`}<span>${esc(e.after||'(없음)')}</span></div></div></li>`).join('')}</ol>`;
}
function sessionTimelinePanel(x){return `<details class="session-timeline-details"><summary>🕘 방제·카테고리 변경 이력 (${(x.changes||[]).length}건)</summary>${sessionTimeline(x)}</details>`}
function sessionForMeta(date,id){
 const today=kstNowParts().date;const a=liveSessions().filter(x=>x.member===id&&typeof x.startedAt==='string'&&x.startedAt.slice(0,10)<=date&&(x.endedAt?x.endedAt.slice(0,10)>=date:date<=today)).sort((a,b)=>b.startedAt.localeCompare(a.startedAt));
 return a.find(x=>!x.endedAt)||a[0]||null;
}
function recordMetaChanges(x,title,category,at){
 if(!Array.isArray(x.changes))x.changes=[];
 const prev=x.meta||{title:'',category:''};
 for(const [field,value] of [['title',title],['category',category]]){
  if((prev[field]||'')!==value)x.changes.push({at,field,before:prev[field]||'',after:value,type:prev[field]?'change':'initial'});
 }
 x.meta={title,category};
}
function validKstMoment(date,clock){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(clock))return false;
 const d=new Date(date+'T12:00:00Z');return !Number.isNaN(d.getTime())&&d.toISOString().slice(0,10)===date;
}

 end=kstLocalISO(ed,et);}

  if(!confirm('변경 이력 중 수정한 방송 시간 범위 밖에 있는 기록이 있습니다. 시간만 수정하고 변경 이력은 보존할까요?'))return;
 }

 addHistory('방송 시간 수정',`${M(x.member)?.name||x.member} ${start}`);render();notify('방송 시간을 수정했습니다.');

function sessionDateList(date){const today=kstNowParts().date;return liveSessions().filter(x=>typeof x.startedAt==='string'&&x.startedAt.slice(0,10)<=date&&(x.endedAt?x.endedAt.slice(0,10)>=date:date<=today)).sort((a,b)=>a.startedAt.localeCompare(b.startedAt))}

function liveByClock(row,date=row.date){
 const session=sessionAt(date,row?.member);if(session)return !session.endedAt;
 if(liveSessions().some(x=>x.member===row?.member&&x.startDate===date&&x.endedAt))return false;
 if(!row||row.status!=='예정'||!/^([01]\d|2[0-3]):[0-5]\d$/.test(row.start||''))return false;

// Smooth transitions for opening panels and switching tabs. Keep touch response immediate.
function smoothRender(kind='page'){
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){render();return}
  const host=document.getElementById('content');
  if(!host){render();return}
  if(typeof document.startViewTransition==='function'){
    try{document.documentElement.dataset.stelliveTransition=kind;
      const transition=document.startViewTransition(()=>render());
      transition.finished.finally(()=>{delete document.documentElement.dataset.stelliveTransition});
      return;
    }catch(e){}
  }
  // Fallback: render synchronously, then animate only the content compositor layer.
  render();
  if(typeof host.animate==='function'){
    try{host.getAnimations().forEach(a=>a.cancel());host.animate([
      {opacity:.64,transform:'translate3d(0,7px,0)'},
      {opacity:1,transform:'translate3d(0,0,0)'}
    ],{duration:kind==='expand'?650:720,easing:'cubic-bezier(.16,1,.3,1)'})}catch(e){}
  }
}

// v1.6.8: anniversary count begins with the first birthday on/after debut.
function birthdayOrdinal(id, date){
 const profile=MEMBER_PROFILE_INFO[id], info=MEMBER_BIRTHDAYS[id];
 if(!profile||!info)return null;
 const match=profile.debut.match(/(\d{4})년\s*(\d{1,2})월(?:\s*(\d{1,2})일)?/);
 if(!match)return null;
 const firstYear=+match[1], debutMD=String(match[2]).padStart(2,'0')+'-'+String(match[3]||'01').padStart(2,'0');
 const firstBirthdayYear=firstYear+(info.date<debutMD?1:0);
 const ordinal=+date.slice(0,4)-firstBirthdayYear+1;
 return ordinal>0?ordinal:null;
}
function birthdayOrdinalText(id,date){const n=birthdayOrdinal(id,date);return n?'데뷔 후 '+n+'번째 생일':'데뷔 전 생일'}
function upcomingBirthdays(limit=2){
 const now=new Date(),today=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
 let out=[];
 for(let y=now.getFullYear();y<=now.getFullYear()+2;y++){
  MEMBERS.forEach(m=>{const info=MEMBER_BIRTHDAYS[m.id];if(!info)return;
   const date=y+'-'+info.date;
   if(date>=today&&birthdayOrdinal(m.id,date)!==null)out.push({member:m,date});
  });
 }
 return out.sort((a,b)=>a.date.localeCompare(b.date)||a.member.name.localeCompare(b.member.name)).slice(0,limit);
}

 const result={},fixed=[['01-01','신정',false],['03-01','삼일절',true],['05-05','어린이날',true],['06-06','현충일',false],['08-15','광복절',true],['10-03','개천절',true],['10-09','한글날',true],['12-25','성탄절',year>=2023]];
 const entries=[];
 const add=(date,name,sub=false)=>{if(!date)return;entries.push({date,name,sub});(result[date]??=[]).push(name)};
 fixed.forEach(([md,name,sub])=>add(`${year}-${md}`,name,sub));
 const lunar=KOREAN_LUNAR_DATES[year];
 if(lunar){
  const newYear=lunar.new,harvest=lunar.chuseok;
  if(newYear){add(plus(newYear,-1),'설날 연휴',true);add(newYear,'설날',true);add(plus(newYear,1),'설날 연휴',true)}
  if(lunar.buddha)add(lunar.buddha,'부처님오신날',year>=2023);
  if(harvest){add(plus(harvest,-1),'추석 연휴',true);add(harvest,'추석',true);add(plus(harvest,1),'추석 연휴',true)}
 }
 // 설·추석은 일요일 또는 다른 공휴일과 겹칠 때, 나머지 적용 대상은 토·일요일 또는 다른 공휴일과 겹칠 때 대체공휴일.
 const lunarGroups=['설날 연휴','설날','추석 연휴','추석'];
 const occupied=new Set(Object.keys(result));
 const groups=[entries.filter(x=>x.name==='설날' || x.name==='설날 연휴'),entries.filter(x=>x.name==='추석' || x.name==='추석 연휴')].filter(x=>x.length);
 for(const group of groups){
  const overlap=group.some(x=>{const weekday=new Date(x.date+'T00:00:00Z').getUTCDay();return weekday===0||entries.some(other=>other!==x&&other.date===x.date&&!lunarGroups.includes(other.name))});
  if(overlap){let d=plus(group[group.length-1].date,1);while(occupied.has(d)||[0,6].includes(new Date(d+'T00:00:00Z').getUTCDay()))d=plus(d,1);(result[d]??=[]).push('대체공휴일');occupied.add(d)}
 }
 for(const e of entries.filter(x=>x.sub&&!lunarGroups.includes(x.name))){
  const wd=new Date(e.date+'T00:00:00Z').getUTCDay();
  const overlap=entries.some(other=>other!==e&&other.date===e.date);
  if(wd===0||wd===6||overlap){let d=plus(e.date,1);while(occupied.has(d)||[0,6].includes(new Date(d+'T00:00:00Z').getUTCDay()))d=plus(d,1);(result[d]??=[]).push('대체공휴일');occupied.add(d)}
 }
 Object.entries(KOREAN_SPECIAL_HOLIDAYS).forEach(([d,name])=>{if(d.startsWith(year+'-'))(result[d]??=[]).push(name)});
 return holidayCache[year]=result;
}
function krHoliday(date){return (krHolidayYear(Number(date.slice(0,4)))[date]||[]).join(' · ')}

 const member=$('spMember').value,type=$('spType').value,startDate=$('spFrom').value,endDate=$('spTo').value,title=$('spTitle').value.trim(),start=$('spTime').value,end=$('spEndTime').value,comment=cleanComment($('spComment').value),source=$('spSource').value.trim();

 if(type==='special'&&startDate!==endDate){notify('특별방송은 하루씩 등록해 주세요.');return}

 if(!Array.isArray(db.specialSchedules))db.specialSchedules=[];

 db.specialSchedules.push(entry);editingSpecial=null;
 addHistory('특별 일정 등록/수정',`${M(member).name} ${startDate}~${endDate} ${type}`);

}

function calDaySummary(d){
 const personal=MEMBERS.map(m=>getRow(m.id,d)).filter(s=>s.status!=='미정');
 const ev=events(d);
 const active=new Set(personal.filter(s=>s.status==='예정').map(s=>s.member));
 // A participant counts as scheduled even if the group notice is the only registered item.
 ev.forEach(e=>(e.participants||[]).forEach(id=>active.add(id)));
 const off=new Set(personal.filter(s=>s.status==='휴방'&&!active.has(s.member)).map(s=>s.member));
 return {active:active.size,off:off.size,ev,personal};
}

function saveLiveMeta(date,id){
 const title=document.getElementById('live-title-'+id)?.value.trim()||'';
 let category=document.getElementById('live-category-'+id)?.value.trim()||'';
 if(['토크','Talk','TALK','저챗','Just Chatting'].includes(category))category='talk';
 if(['음악','노래'].includes(category))category='음악/노래';
 const x=sessionForMeta(date,id);
 if(x){
  const at=kstLocalISO(kstNowParts().date,kstNowParts().clock);
  if(Date.parse(at)<Date.parse(x.startedAt)){notify('방송 시작 전에는 변경 이력을 기록할 수 없습니다.');return;}
  if(x.endedAt&&Date.parse(at)>Date.parse(x.endedAt)){notify('이미 종료된 방송입니다. 변경 이력은 종료 전까지만 기록할 수 있습니다.');return;}
  if(!x.meta){const old=liveMeta(x.startDate,id);x.meta={title:old.title||'',category:old.category||''};}
  recordMetaChanges(x,title,category,at);
 }
 db.liveDetails=db.liveDetails||{};
 const saveDate=x?x.startDate:date;
 if(title||category)db.liveDetails[liveMetaKey(saveDate,id)]={title,category};
 else delete db.liveDetails[liveMetaKey(saveDate,id)];
 addHistory('LIVE 정보 수정',`${date} ${M(id)?.name||id} · 방제/카테고리${x?' · 세션 이력 저장':''}`);
 render();notify(x?'LIVE 정보 및 변경 시각을 기록했습니다.':'LIVE 방송 정보를 저장했습니다.');
}
function clearLiveMeta(date,id){

 const x=sessionForMeta(date,id);if(x){const now=kstNowParts(),at=kstLocalISO(now.date,now.clock);if(Date.parse(at)<Date.parse(x.startedAt)||x.endedAt&&Date.parse(at)>Date.parse(x.endedAt)){notify('방송 진행 시간 밖의 변경 기록은 저장할 수 없습니다.');return;}recordMetaChanges(x,'','',at);}delete db.liveDetails[liveMetaKey(x?x.startDate:date,id)];
 addHistory('LIVE 정보 삭제',`${date} ${M(id)?.name||id}`);
 render();notify('LIVE 정보만 삭제했습니다.');
}
function calTimeline(d,kindFilter="all"){

 }

 return `<div class="cal-timeline-row"><span class="cal-timeline-time">${when}</span>${av(s.member)}<div class="cal-info"><strong>${esc(m?.name||s.member)} <span class="cal-timeline-kind">${x.kind==='special'?'✦ 특별방송':'개인 일정'}</span><span data-live-member=\"${s.member}\" data-live-date=\"${d}\"></span></strong><small>${esc(x.title)}</small>${commentBadge(s)}</div></div>`;
 }).join('');

function copyMemberSchedule(){
 const member=$('copyMember').value,from=$('copyFrom').value,to=$('copyTo').value;
 if(!from||!to){notify('원본 날짜와 대상 날짜를 선택해 주세요.');return}
 if(from===to){notify('원본과 다른 날짜를 선택해 주세요.');return}
 const source=db.schedules.find(x=>x.date===from&&x.member===member);
 if(!source){notify('원본 날짜에 직접 등록된 멤버 일정이 없습니다.');return}
 const previous=db.schedules.find(x=>x.date===to&&x.member===member);
 if(previous&&!confirm(`${M(member).name}님의 ${to} 일정이 이미 있습니다. 덮어쓸까요?`))return;
 const copy={...source,date:to};
 db.schedules=db.schedules.filter(x=>!(x.date===to&&x.member===member));
 db.schedules.push(copy);

 day=to;render();notify('일정을 복사했습니다. 원본 일정은 유지됩니다.');
 $('member').value=member;loadMember();
}

function recurringPreview(){
 const out=$('recurringPreview');if(!out)return;
 const from=$('repeatFrom').value,to=$('repeatTo').value;
 if(!from||!to||from>to){out.textContent='시작일과 종료일을 올바르게 지정해 주세요.';return}
 const selected=[...document.querySelectorAll('.repeat-weekday:checked')].map(x=>Number(x.value));
 const days=repeatDates(from,to,selected);
 if(!days){out.textContent='반복 기간은 최대 180일까지 설정할 수 있습니다.';return}
 const id=$('repeatMember').value,exists=days.filter(d=>db.schedules.some(x=>x.date===d&&x.member===id)).length;
 out.textContent=`등록 대상 ${days.length}일 · 기존 일정 ${exists}일(건너뜀) · 신규 ${days.length-exists}일`;
}
function repeatDates(from,to,weekdays){
 const a=new Date(from+'T12:00:00'),b=new Date(to+'T12:00:00');
 if(!Number.isFinite(+a)||!Number.isFinite(+b)||a>b||(+b- +a)/86400000>180)return null;
 const dates=[];for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1)){
  if(weekdays.includes(d.getDay()))dates.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
 }return dates;
}
function saveRecurringSchedules(){
 const id=$('repeatMember').value,from=$('repeatFrom').value,to=$('repeatTo').value;
 const selected=[...document.querySelectorAll('.repeat-weekday:checked')].map(x=>Number(x.value));
 const dates=repeatDates(from,to,selected);
 if(!dates){notify('날짜를 확인해 주세요. 반복 기간은 최대 180일입니다.');return}
 if(!selected.length||!dates.length){notify('반복할 요일과 해당 날짜를 선택해 주세요.');return}
 const status=$('repeatStatus').value,start=$('repeatStart').value,end=$('repeatEnd').value;
 if(status==='예정'&&start&&end&&end<=start){notify('종료 시각을 확인해 주세요.');return}
 const title=$('repeatTitle').value.trim(),comment=cleanComment($('repeatComment').value),source='반복 일정 직접 등록';
 const fresh=dates.filter(d=>!db.schedules.some(x=>x.date===d&&x.member===id));
 const skipped=dates.length-fresh.length;
 if(!fresh.length){notify('대상 날짜에 이미 일정이 모두 등록되어 있습니다.');return}
 if(!confirm(`${M(id).name}님의 반복 일정을 ${fresh.length}건 등록할까요?\n기존 일정 ${skipped}건은 건너뜁니다.`))return;
 for(const date of fresh)db.schedules.push({date,member:id,status,start:status==='예정'?start:'',end:status==='예정'?end:'',title,comment,source});
 addHistory('반복 일정 등록',`${M(id).name} ${from}~${to} 신규 ${fresh.length}건 · 기존 ${skipped}건 건너뜀`);
 render();notify(`반복 일정 ${fresh.length}건 등록 완료 · ${skipped}건 건너뜀`);
}

function quickStatus(id,status){let old=getRow(id),exists=db.schedules.some(x=>x.date===day&&x.member===id);let next={date:day,member:id,status,start:status==='예정'?old.start:'',end:status==='예정'?old.end:'',title:old.title==='등록된 공지 없음'?'':old.title,source:old.source||''};db.schedules=db.schedules.filter(x=>!(x.date===day&&x.member===id));db.schedules.push(next);addHistory(exists?'상태 빠른 변경':'상태 빠른 등록',`${day} ${M(id).name} ${old.status} → ${status}`);render();notify(`${M(id).name}: ${status} 저장됨`)}
function quickTime(id){let r=getRow(id);let value=prompt(`${M(id).name} 시작 시간 (HH:MM, 빈칸은 미정)`,r.start||'20:00');if(value===null)return;value=value.trim();if(value&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(value)){notify('시간은 20:00 형식으로 입력하세요.');return}let next={...r,date:day,member:id,status:'예정',start:value,end:r.end||'',title:r.title==='등록된 공지 없음'?'':r.title,source:r.source||''};if(next.end&&value&&next.end<=value)next.end='';db.schedules=db.schedules.filter(x=>!(x.date===day&&x.member===id));db.schedules.push(next);addHistory('시간 빠른 변경',`${day} ${M(id).name} ${value||'미정'}`);render();notify('시작 시간 저장됨')}

 const mode=document.getElementById('evBroadcastMode')?.value||'unknown';

 const hint=document.getElementById('broadcastModeHint');if(hint)hint.textContent=({unknown:'송출 여부가 확인되지 않았다면 미확정으로 두세요.',single:'선택한 메인 송출 채널에서 방송합니다.',multi:'참여 멤버가 각자 자신의 채널에서 방송합니다.',partial:'참여 멤버 중 실제 송출하는 사람만 아래에서 선택하세요.',relay:'방송을 이어서 진행하는 멤버들을 아래에서 선택하세요. 순서는 제목·출처에 기록할 수 있습니다.',external:'스텔라이브 멤버 외 공식·외부 채널에서 송출하는 경우입니다.',none:'참여는 하지만 해당 합방 방송 송출은 없습니다.'})[mode];
 document.querySelectorAll('.broadcast-streamer').forEach(el=>{const id=el.querySelector('input')?.value;el.classList.toggle('chosen',!!el.querySelector('input')?.checked);el.classList.toggle('inactive',!document.querySelector(`.participant[value="${id}"]`)?.checked)});

// v1.1.1: delegated touch ripple for dynamically rendered buttons.
document.addEventListener('pointerdown',function(e){
  const btn=e.target.closest('button');
  if(!btn||btn.disabled||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const rect=btn.getBoundingClientRect();
  const wave=document.createElement('span');wave.className='motion-ripple';
  wave.style.setProperty('--ripple-x',(e.clientX-rect.left)+'px');
  wave.style.setProperty('--ripple-y',(e.clientY-rect.top)+'px');
  btn.appendChild(wave);
  wave.addEventListener('animationend',()=>wave.remove(),{once:true});
  setTimeout(()=>wave.remove(),850);
},{passive:true});

let noticeCandidates=[];
function noticeDate(text){
 const iso=text.match(/(20\d{2})[.\-/년]\s*(\d{1,2})[.\-/월]\s*(\d{1,2})/);
 const short=text.match(/(\d{1,2})[.\-/월]\s*(\d{1,2})\s*일?/);
 const year=iso?+iso[1]:+day.slice(0,4),mo=iso?+iso[2]:short?+short[1]:+day.slice(5,7),da=iso?+iso[3]:short?+short[2]:+day.slice(8,10);
 const d=new Date(Date.UTC(year,mo-1,da));
 if(d.getUTCFullYear()!==year||d.getUTCMonth()+1!==mo||d.getUTCDate()!==da)return day;
 return [year,String(mo).padStart(2,'0'),String(da).padStart(2,'0')].join('-');
}
function noticeTime(text){
 const m=text.match(/(?:오후|저녁|밤|오전)?\s*(?:[01]?\d|2[0-3])\s*(?::|시)\s*(?:[0-5]?\d)?(?:분)?/);
 if(!m)return '';
 const raw=m[0],parts=raw.match(/(\d{1,2})\s*(?::|시)\s*(\d{1,2})?/);
 if(!parts)return '';
 let h=+parts[1],min=+(parts[2]||0);
 if(/오후|저녁|밤/.test(raw)&&h<12)h+=12;
 if(/오전/.test(raw)&&h===12)h=0;
 if(h>23||min>59)return '';
 return String(h).padStart(2,'0')+':'+String(min).padStart(2,'0');
}
function memberAliases(m){return [m.name,m.name.split(' ').slice(-1)[0],...(m.id==='shibuki'?['부키']:[])]}

 const lines=raw.split(/\n+/).map(x=>x.trim()).filter(Boolean),allDate=noticeDate(raw);
 noticeCandidates=[];
 for(const line of lines){
  const names=MEMBERS.filter(m=>memberAliases(m).some(a=>line.includes(a)));
  if(!names.length)continue;
  const status=/휴방|방송\s*없|쉬어|휴식|결방/.test(line)?'휴방':/미정|추후\s*공지/.test(line)?'미정':'예정';
  const date=noticeDate(line)===day&&!/\d{1,2}\s*[월.\/-]\s*\d{1,2}/.test(line)?allDate:noticeDate(line);

 }
 // '토요리'는 토아+히요리 2인 합방을 뜻하며, 1부와 별개 합방으로 취급합니다.

   noticeCandidates.push({type:'event',date:allDate,start:'',title:'2부 토요리 (토아 × 히요리) 합방',participants:['toa','hiyori'],host:'',broadcastMode:'multi',afterTitle:'싱크룸'});

 }
 if(/(?:2부|개인\s*방송|방송\s*킬|방송\s*켤)/.test(raw)&&/(?:끝나|종료|이후|후에|끝나구)/.test(raw)){const mer=MEMBERS.find(m=>m.name==='메리');if(mer&&/메리/.test(raw))noticeCandidates.push({type:'segment',date:allDate,member:mer.id,status:'예정',start:'',title:'싱크룸 종료 후 식사, 2부 개인 방송'});}if(!noticeCandidates.length){area.innerHTML='<p class="notice">14명 멤버 이름이 포함된 일정 후보를 찾지 못했습니다. 원문을 수정해 다시 분석해 주세요.</p>';return}
 area.innerHTML='<h3>저장 전 확인 · '+noticeCandidates.length+'건</h3><p class="muted">자동 추정 결과입니다. 날짜·시간·내용을 확인하고 수정하세요. 체크한 항목만 저장됩니다.</p>'+noticeCandidates.map((c,i)=>`<div class="notice-candidate"><label><input type="checkbox" class="candidate-check" data-i="${i}" checked> ${c.type==='event'?'👥 합방':c.type==='segment'?'🎬 2부 방송':esc(M(c.member).name)}</label><input type="date" id="candidate-date-${i}" value="${c.date}"><div class="formgrid"><select id="candidate-status-${i}" ${c.type==='event'?'disabled':''}><option ${c.status==='예정'?'selected':''}>예정</option><option ${c.status==='휴방'?'selected':''}>휴방</option><option ${c.status==='미정'?'selected':''}>미정</option></select><input type="time" id="candidate-time-${i}" value="${c.start}"></div><input id="candidate-title-${i}" value="${esc(c.title).replace(/"/g,'&quot;')}"><small class="muted">${c.type==='event'?'참여: '+c.participants.map(x=>M(x).name).join(', ')+(c.host?' · 송출: '+M(c.host).name:'')+(c.afterTitle?' · '+c.afterTitle+' 종료 후':'')+(c.broadcastMode==='multi'?' · 각자 송출 예상 (미확정)':''):c.type==='segment'?'합방 이후 별도 일정':'개인 일정'}</small></div>`).join('')+'<button onclick="applyNoticeCandidates()">선택 일정 저장</button>';

  const i=+box.dataset.i,c=noticeCandidates[i],date=document.getElementById('candidate-date-'+i).value;

   const existing=db.events.find(e=>e.date===date&&(e.title===title||(start&&e.start===start&&c.participants.length===e.participants?.length&&c.participants.every(p=>e.participants.includes(p)))));
   if(existing){existing.title=title;existing.start=start||existing.start;existing.participants=c.participants;if(c.host)existing.host=c.host;if(c.broadcastMode)existing.broadcastMode=c.broadcastMode;if(c.afterTitle){const parent=db.events.find(x=>x.date===date&&x.id!==existing.id&&x.title.includes(c.afterTitle));if(parent)existing.afterEventId=parent.id;}}
   else db.events.push({id:'ev'+Date.now()+'_'+i,date,title,start,end:'',participants:c.participants,host:c.host||'',broadcastMode:c.broadcastMode||'unknown',afterEventId:c.afterTitle?(db.events.find(x=>x.date===date&&x.title.includes(c.afterTitle))?.id||''):'',source:'팬카페 텍스트 공지'});
  }else{
   const status=document.getElementById('candidate-status-'+i).value;
   const prev=db.schedules.find(x=>x.date===date&&x.member===c.member);const next={...(prev||{}),date,member:c.member,status,start:status==='예정'?(start||prev?.start||''):'',end:prev?.end||'',title,source:'팬카페 텍스트 공지'};if(!sameSchedule(prev,next)){db.schedules=db.schedules.filter(x=>!(x.date===date&&x.member===c.member));db.schedules.push(next);}else continue;
  }
  applied++;
 }
 if(applied){addHistory('공지 텍스트 가져오기',applied+'건 확인 후 저장');render();notify(applied+'건 저장했습니다.')}
}

function segments(d=day){return (db.segments||[]).filter(x=>x.date===d).sort((a,b)=>(a.start||'99').localeCompare(b.start||'99'))}
function segmentUI(id,d=day){return segments(d).filter(x=>x.member===id).map(x=>`<div class="segment-tag">🎬 ${esc(x.start||'시간 미정')} · ${esc(x.title)} <span class="muted">(${esc(x.status)})</span></div>`).join('')}
function segmentManageUI(x){return `<div class="segment-manage">${av(x.member)}<div class="grow"><strong>${esc(M(x.member)?.name)} · ${esc(x.start||'시간 미정')}</strong><div class="desc">${esc(x.title)} · ${esc(x.status)}</div></div><button class="tiny danger" onclick="deleteSegment('${esc(x.id)}')">삭제</button></div>`}
function saveSegment(){let member=$('segMember').value,start=$('segTime').value,status=$('segStatus').value,title=$('segTitle').value.trim();if(!title){notify('2부 방송 내용을 입력하세요.');return}db.segments=db.segments||[];db.segments.push({id:'seg'+Date.now(),date:day,member,start,status,title});addHistory('추가 방송 등록',`${day} ${M(member).name} ${title}`);render();notify('추가 방송을 저장했습니다.')}
function deleteSegment(id){let x=(db.segments||[]).find(x=>x.id===id);if(!x)return;rememberDelete('추가 방송');db.segments=db.segments.filter(x=>x.id!==id);addHistory('추가 방송 삭제',`${x.date} ${M(x.member).name}`);render();notify('삭제했습니다.')}
function findNoticeHost(t){const m=t.match(/(유니|후야|히나|마시로|리제|타비|시부키|린|나나|리코|토아|랑|히요리|메리)\s*(?:님)?\s*(?:의\s*)?방송(?:에서|으로|채널에서)/);return m?(MEMBERS.find(x=>x.name===m[1])?.id||''):''}
function prepareAbyssNotice(){
 const d='2026-10-24',ids=['toa','rang','hiyori','meri'];
 let e=db.events.find(x=>x.date===d&&x.participants&&ids.every(id=>x.participants.includes(id))&&/싱크룸|ABYSS|어비스/.test(x.title));
 if(!e){e={id:'ev-abyss-20261024',date:d,title:'ABYSS 싱크룸 합방',start:'17:00',end:'',participants:ids,source:'메리 공지'};db.events.push(e)}
 e.host='toa';e.start='17:00';
 db.segments=db.segments||[];
 if(!db.segments.some(x=>x.date===d&&x.member==='meri'&&/2부/.test(x.title)))db.segments.push({id:'seg-meri-20261024',date:d,member:'meri',start:'',status:'예정',title:'싱크룸 종료 후 식사, 2부 개인 방송'});
 addHistory('메리 공지 반영','10/24 17:00 토아 채널 싱크룸 · 메리 2부 시간 미정');render();notify('메리 공지 내용이 반영되었습니다.')
}

function updateCollabPicker(){
 const boxes=[...document.querySelectorAll('.collab-member')],host=document.getElementById('evHost')?.value||'';
 let n=0;
 for(const label of boxes){const checked=!!label.querySelector('.participant')?.checked;label.classList.toggle('chosen',checked);label.classList.toggle('main-channel',checked&&label.querySelector('.participant')?.value===host);if(checked)n++}
 const counter=document.getElementById('collabSelectionCount');if(counter)counter.textContent=n+'명 선택';updateBroadcastModeUI();
 const hint=document.getElementById('collabHostHint');if(hint)hint.textContent=host?(M(host)?.name+' 채널에서 메인 송출 · '+(boxes.some(x=>x.querySelector('.participant')?.value===host&&x.querySelector('.participant')?.checked)?'참여 멤버 포함':'참여 멤버 체크도 확인해 주세요.')):'메인 송출자를 선택하면 참여 멤버 목록에서 강조됩니다.';
}
function setAllCollabParticipants(checked){document.querySelectorAll('.participant').forEach(el=>el.checked=checked);updateCollabPicker()}

new MutationObserver(()=>{const counter=document.getElementById('collabSelectionCount');if(counter&&!counter.dataset.initialized){counter.dataset.initialized='1';updateCollabPicker()}}).observe(document.body,{childList:true,subtree:true});

/* Beta 7: lightweight STUDIO draft persistence and fast member switching. */
const STUDIO_DRAFT_KEY='my-stellive-studio-draft-v2.1';
const STUDIO_FIELDS=['status','start','end','title','comment','source'];
function studioDraftRead(){try{return JSON.parse(sessionStorage.getItem(STUDIO_DRAFT_KEY)||'null')}catch(e){return null}}
function clearStudioDraft(){try{sessionStorage.removeItem(STUDIO_DRAFT_KEY)}catch(e){}}
function captureStudioDraft(){
 if(view!=='manage'||!document.getElementById('member'))return;
 const draft={day,member:$('member').value,fields:{}};
 STUDIO_FIELDS.forEach(k=>{if($(k))draft.fields[k]=$(k).value});
 try{sessionStorage.setItem(STUDIO_DRAFT_KEY,JSON.stringify(draft))}catch(e){}
 const badge=document.getElementById('studioDraftStatus');if(badge)badge.textContent='● 임시 입력 보관됨 · 저장 전';
}
function hydrateStudioDraft(){
 const member=$('member');if(!member)return;
 const d=studioDraftRead();
 if(d&&d.day===day&&MEMBERS.some(m=>m.id===d.member)){
  member.value=d.member;loadMember();
  STUDIO_FIELDS.forEach(k=>{if($(k)&&typeof d.fields?.[k]==='string')$(k).value=d.fields[k]});
  const badge=document.getElementById('studioDraftStatus');if(badge)badge.textContent='● 이전 임시 입력 복원됨';
 }else{loadMember()}
 const card=member.closest('.card');
 if(card&&!card.dataset.draftBound){card.dataset.draftBound='1';card.addEventListener('input',e=>{if(STUDIO_FIELDS.includes(e.target.id))captureStudioDraft()});card.addEventListener('change',e=>{if(STUDIO_FIELDS.includes(e.target.id))captureStudioDraft()})}
}
function shiftStudioMember(step){
 const select=$('member');if(!select)return;
 const index=MEMBERS.findIndex(m=>m.id===select.value);
 select.value=MEMBERS[(index+step+MEMBERS.length)%MEMBERS.length].id;
 clearStudioDraft();loadMember();
 const badge=document.getElementById('studioDraftStatus');if(badge)badge.textContent='다른 멤버로 이동했습니다.';
}
function resetStudioInputs(){clearStudioDraft();loadMember();notify('현재 멤버의 저장된 일정으로 되돌렸습니다.')}
